# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Also opens javac internals for google-java-format (Spotless) on JDK 17+.
org.gradle.jvmargs=-Xmx3G --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.parallel=true

# Minecraft/Forge Properties
# check these on https://files.minecraftforge.net/
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod Properties
version=0.1.6
group=io.github.keeningdawn.configurablehunger
mod_id=configurable_hunger
mod_name=Configurable Hunger
mod_license=GPL-3.0-or-later
